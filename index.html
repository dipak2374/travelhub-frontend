<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml+png" href="/browser_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          const params = new URLSearchParams(location.search);
          const api = params.get('force_api');
          const socket = params.get('force_socket');
          if (api) {
            // Allow quick runtime override for testing (e.g. ?force_api=https://example.com/api)
            window.__API_URL__ = api;
            console.log('Runtime override: window.__API_URL__ =', api);
          }
          if (socket) {
            window.__SOCKET_URL__ = socket;
            console.log('Runtime override: window.__SOCKET_URL__ =', socket);
          }
        } catch (err) {
          console.warn('API override init error', err);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
